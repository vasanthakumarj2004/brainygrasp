# Compatibility entry point: same split deployment as docker-compose.yml.
# Default: docker compose up -d
# Alternative: docker compose -f docker-compose.prod.yml up -d
services:
  frontend:
    extends:
      file: docker-compose.yml
      service: frontend
  backend:
    extends:
      file: docker-compose.yml
      service: backend
  db:
    extends:
      file: docker-compose.yml
      service: db
  redis:
    extends:
      file: docker-compose.yml
      service: redis
volumes:
  postgres_data:
  redis_data:
