# BrainyGrasp: HOST Nginx routes to the separate Docker frontend and API.
# Install as /etc/nginx/sites-available/brainygrasp on Ubuntu/Debian, then
# enable it with a symlink in /etc/nginx/sites-enabled/.
# Replace BOTH domain names if your domain differs.
#
# First installation uses HTTP so Nginx can start before certificates exist.
# Once both DNS names point here and port 80 is reachable, run:
#   sudo certbot --nginx --redirect -d brainygrasp.com -d www.brainygrasp.com
# Certbot adds the HTTPS listener, certificate paths and HTTP redirect.
# Do not overwrite the installed file with this bootstrap after Certbot runs.

server {
    listen 80;
    listen [::]:80;
    server_name brainygrasp.com www.brainygrasp.com;

    server_tokens off;
    access_log /var/log/nginx/brainygrasp.access.log;
    error_log /var/log/nginx/brainygrasp.error.log warn;

    # Match the application's JSON and raw Razorpay webhook body limit.
    client_max_body_size 256k;
    client_body_timeout 30s;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # This is the API's only proxy hop. Replace client-supplied headers.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;

    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Pass application errors through and never cache or replay checkout.
    proxy_cache off;
    proxy_intercept_errors off;
    proxy_next_upstream off;

    # No trailing slash: preserve /api, query strings and webhook paths.
    location = /api {
        proxy_pass http://127.0.0.1:5000;
    }
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:5000;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
