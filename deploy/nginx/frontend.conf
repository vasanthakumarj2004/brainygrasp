# Static server INSIDE the frontend image. Host Nginx handles TLS and /api.
map $uri $static_cache_control {
    default "public, max-age=0, must-revalidate";
    ~*\.html$ "no-store";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html login.html;
    server_tokens off;
    absolute_redirect off;
    add_header Cache-Control $static_cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' https://checkout.razorpay.com https://api.razorpay.com https://cdn.razorpay.com https://checkout-static-next.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://checkout-static-next.razorpay.com; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: blob: https:; connect-src 'self' http://localhost:3000 http://127.0.0.1:3000 https://brainygrasp-api.onrender.com https://api.razorpay.com https://checkout.razorpay.com https://lumberjack.razorpay.com; frame-src https://api.razorpay.com https://checkout.razorpay.com; form-action 'self' https://api.razorpay.com https://checkout.razorpay.com" always;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location = /api {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ /\. { deny all; }
    location ~ ^/(?:frontend/)?dashboard-new(?:\.html)?$ {
        return 301 /dashboard$is_args$args;
    }
    location ~ ^/(?:frontend/)?checkout_cod(?:\.html)?$ {
        return 301 /checkout$is_args$args;
    }
    location / {
        # Check the original browser request, not an internal index/try_files
        # lookup, so clean URLs never loop back through this redirect.
        if ($request_uri ~ "^(/[a-zA-Z0-9_-][a-zA-Z0-9_/-]*)\.html(?:\?|$)") {
            return 308 $1$is_args$args;
        }
        try_files $uri $uri/ $uri.html =404;
    }
}
