<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in - BrainyGrasp</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/mobile-responsive.css">
  <style>
    :root{--bg:#f6fbff;--card:#ffffff;--accent:#0b74ff;--muted:#6b7280}
    html,body{height:100%}
    body{margin:0;font-family:Nunito,system-ui,Segoe UI,Roboto,Arial;background:linear-gradient(180deg,#f7fbff 0%, #eef6ff 100%);display:flex;align-items:center;justify-content:center;padding:32px}
    .auth-shell{width:100%;max-width:920px;display:grid;grid-template-columns:1fr 420px;gap:32px;align-items:center}
    .auth-hero{display:flex;flex-direction:column;gap:16px;padding:28px;background:transparent}
    .auth-hero h1{font-size:28px;margin:0;color:#0f172a}
    .auth-hero p{margin:0;color:var(--muted)}
    .auth-container{background:var(--card);border-radius:12px;padding:28px;box-shadow:0 10px 30px rgba(12,34,61,0.08)}
    .brand{display:flex;align-items:center;gap:12px;margin-bottom:12px}
    .brand .logo-icon{width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#6bc1ff);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700}
    .input-group{margin-bottom:14px;display:flex;flex-direction:column;gap:6px}
    .input-group label{font-size:13px;color:#334155}
    input[type="email"],input[type="password"]{padding:12px 14px;border:1px solid #e6eefb;border-radius:8px;font-size:15px}
    .btn-primary{background:var(--accent);color:#fff;border:none;padding:10px 14px;border-radius:8px;font-weight:600;cursor:pointer}
    .btn-primary:focus{outline:3px solid rgba(11,116,255,0.2)}
    .error-msg{color:#c53030;margin-bottom:8px;display:none}
    .muted{color:var(--muted);font-size:13px}
    .footer-note{font-size:13px;color:var(--muted);margin-top:12px;text-align:center}
    @media (max-width:900px){.auth-shell{grid-template-columns:1fr;max-width:520px}.auth-hero{order:2}}
    @media (max-width:600px){
      body{padding:16px 12px}
      .auth-container{padding:20px 14px}
      .auth-hero{padding:16px 8px}
    }
  </style>
  <link rel="stylesheet" href="css/policy-mobile.css">
</head>
<body>
  <div class="auth-shell">
    <div class="auth-hero">
      <h1>BrainyGrasp verification access</h1>
      <p class="muted">Use the test account credentials provided for storefront verification.</p>
      <div style="margin-top:10px">
        <a href="index.html" class="muted"><i class="fas fa-arrow-left"></i> Back to Home</a>
      </div>
    </div>

    <main class="auth-container" aria-labelledby="signinTitle">
      <div class="brand" style="display: flex; flex-direction: column; align-items: flex-start; gap: 8px; margin-bottom: 20px;">
        <a href="index.html" style="text-decoration: none; display: flex; align-items: center; gap: 6px;">
          <img src="images/logo.jpeg" alt="BrainyGrasp Logo" class="brand-logo" style="height: 40px;">
        </a>
        <div>
          <div id="signinTitle" style="font-weight:700; font-size: 18px; color: #0f172a; margin-top: 4px;">Test account sign in</div>
          <div class="muted" style="font-size:13px">Email and password login for verification</div>
        </div>
      </div>
      <form id="reviewerLoginForm">
        <div class="input-group">
          <label for="reviewerEmail">Email address</label>
          <input id="reviewerEmail" name="email" type="email" placeholder="Enter the test email address"
                 autocomplete="username" required aria-required="true">
        </div>
        <div class="input-group">
          <label for="reviewerPassword">Password</label>
          <input id="reviewerPassword" name="password" type="password"
                 autocomplete="current-password" required maxlength="72">
        </div>
        <p id="reviewerError" class="error-msg" role="alert"></p>
        <button id="reviewerLoginBtn" class="btn-primary" type="submit">Sign in</button>
        <div class="footer-note">Test account access for Razorpay verification.</div>
      </form>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/cart-sync.js"></script>
  <script src="js/auth-unified.js"></script>
  <script src="js/reviewer-login.js"></script>
  <script src="js/mobile-enhancements.js"></script>
</body>
</html>
